spring.application.name=truckstop-services
spring.datasource.url=jdbc:mysql://localhost:3308/truckstop_services
spring.datasource.jdbc-url=jdbc:mysql://localhost:3308/truckstop_services
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
server.port=9000

# Startup Banner Configuration
# Available options: rig | cyber | synthwave | minimal
app.banner=rig
spring.banner.location=classpath:banners/banner-${app.banner:rig}.txt


springdoc.swagger-ui.path=/swagger-ui.html

# Spring Actuator Configuration
# Expose only safe health and info endpoints (protects environment variables and credentials)
management.endpoints.web.exposure.include=health,info
# Show full health details
management.endpoint.health.show-details=always

# Enable Actuator endpoints in Swagger UI
springdoc.show-actuator=true

# Historical Database Connection Settings
app.historical.datasource.jdbc-url=jdbc:mysql://localhost:3308/truckstop_historical
app.historical.datasource.username=root
app.historical.datasource.password=password
app.historical.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
